  <!-- Content: one data file per section -->
  <script src="js/data/tool-links.js"></script>
  <script src="js/data/hero.js"></script>
  <script src="js/data/about.js"></script>
  <script src="js/data/skills.js"></script>
  <script src="js/data/projects.js"></script>
  <script src="js/data/experience.js"></script>
  <script src="js/data/education.js"></script>
  <script src="js/data/certifications.js"></script>
  <script src="js/data/hobbies.js"></script>
  <script src="js/data/contact.js"></script>
  <script src="js/render.js"></script>
  <script>
    (() => {
      // Light / dark switch: Ocean blue (dark) and Lavender mist (light)
      const themeStorageKey = "abin-portfolio-mode";
      const themeFor = { dark: "ocean", light: "lavender" };
      const modeToggle = document.querySelector(".mode-toggle");
      const applyTheme = (mode) => {
        const root = document.documentElement;
        root.dataset.theme = themeFor[mode];
        root.dataset.mode = mode;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", getComputedStyle(root).getPropertyValue("--bg").trim());
        if (modeToggle) {
          modeToggle.setAttribute("aria-pressed", String(mode === "light"));
          modeToggle.setAttribute("aria-label", mode === "light" ? "Switch to dark mode" : "Switch to light mode");
          modeToggle.title = modeToggle.getAttribute("aria-label");
        }
      };
      applyTheme(document.documentElement.dataset.mode === "light" ? "light" : "dark");
      if (modeToggle) modeToggle.addEventListener("click", () => {
        const root = document.documentElement;
        if (root.classList.contains("theme-switching")) return;          // ignore double clicks mid-switch
        const next = root.dataset.mode === "light" ? "dark" : "light";
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const finish = () => requestAnimationFrame(() => {
          root.classList.remove("theme-switching");
          window.dispatchEvent(new CustomEvent("themechange"));
        });
        root.classList.add("theme-switching");
        if (document.startViewTransition && !reduce) {
          const transition = document.startViewTransition(() => applyTheme(next));
          transition.finished.then(finish, finish);
        } else {
          // Fallback: snapshot the old background as an overlay, swap instantly underneath, fade the overlay out
          const overlay = document.createElement("div");
          overlay.className = "theme-fade-overlay";
          overlay.style.background = getComputedStyle(root).getPropertyValue("--bg");
          document.body.appendChild(overlay);
          applyTheme(next);
          requestAnimationFrame(() => requestAnimationFrame(() => { overlay.style.opacity = "0"; }));
          setTimeout(() => { overlay.remove(); finish(); }, reduce ? 0 : 340);
        }
        try { localStorage.setItem(themeStorageKey, next); } catch (error) {}
      });

      const progress = document.querySelector(".scroll-progress");
      let progressFrame = 0;
      const updateProgress = () => {
        if (progressFrame) return;
        progressFrame = requestAnimationFrame(() => {
          const range = document.documentElement.scrollHeight - window.innerHeight;
          const amount = range > 0 ? Math.min(1, Math.max(0, window.scrollY / range)) : 0;
          if (progress) progress.style.transform = `scaleX(${amount})`;
          progressFrame = 0;
        });
      };
      window.addEventListener("scroll", updateProgress, { passive: true });
      window.addEventListener("resize", updateProgress, { passive: true });
      updateProgress();

      const cards = [...document.querySelectorAll(".project[data-category]")];
      const filters = [...document.querySelectorAll("[data-filter]")];
      const status = document.querySelector(".filter-status");
      const labels = Object.fromEntries((((window.PORTFOLIO || {}).projects || {}).filters || []).map((f) => [f.key, f.label || f.key]));

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      // Sliding pill behind the active filter
      const filterGroup = document.querySelector(".project-filters");
      const indicator = document.createElement("span");
      indicator.className = "filter-indicator";
      indicator.setAttribute("aria-hidden", "true");
      if (filterGroup) { filterGroup.prepend(indicator); filterGroup.classList.add("has-indicator"); }
      const moveIndicator = (button, instant) => {
        if (!button) return;
        if (instant) indicator.style.transition = "none";
        indicator.style.width = `${button.offsetWidth}px`;
        indicator.style.height = `${button.offsetHeight}px`;
        indicator.style.transform = `translate(${button.offsetLeft}px, ${button.offsetTop}px)`;
        if (instant) { indicator.offsetWidth; indicator.style.transition = ""; }
      };
      moveIndicator(filters.find((b) => b.getAttribute("aria-pressed") === "true"), true);
      window.addEventListener("resize", () => moveIndicator(filters.find((b) => b.getAttribute("aria-pressed") === "true"), true), { passive: true });
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveIndicator(filters.find((b) => b.getAttribute("aria-pressed") === "true"), true));

      let filterTimer = 0;
      filters.forEach((button) => button.addEventListener("click", () => {
        const filter = button.dataset.filter;
        let visible = 0;
        filters.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        moveIndicator(button);
        const matches = (card) => filter === "all" || card.dataset.category.split(" ").includes(filter);
        cards.forEach((card) => { if (matches(card)) visible += 1; });
        const text = filter === "all"
          ? `Showing all ${visible} projects`
          : `Showing ${visible} ${labels[filter]}${visible === 1 ? "" : "s"}`;

        clearTimeout(filterTimer);
        if (reduceMotion) {
          cards.forEach((card) => { card.hidden = !matches(card); });
          if (status) status.textContent = text;
          return;
        }
        cards.forEach((card) => { card.classList.remove("is-entering"); if (!card.hidden && !matches(card)) card.classList.add("is-leaving"); });
        if (status) status.classList.add("is-updating");
        filterTimer = setTimeout(() => {
          let order = 0;
          cards.forEach((card) => {
            card.classList.remove("is-leaving");
            const show = matches(card);
            card.hidden = !show;
            if (show) {
              card.classList.add("reveal", "is-visible");
              card.style.setProperty("--enter-delay", `${order++ * 70}ms`);
              card.classList.add("is-entering");
            }
          });
          if (status) { status.textContent = text; status.classList.remove("is-updating"); }
        }, 240);
      }));
      cards.forEach((card) => card.addEventListener("animationend", (e) => { if (e.animationName === "project-in") card.classList.remove("is-entering"); }));

      if ("IntersectionObserver" in window && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const revealItems = document.querySelectorAll(".section-head, .about-copy, .pillar, .project, .timeline, .career-track, .career-step, .education-entry, .contact-panel, .hobby, .cert");
        revealItems.forEach((item, index) => {
          item.classList.add("reveal");
          if (item.matches(".section-head")) item.classList.add("reveal--clip");
          else if (item.matches(".about-copy")) item.classList.add(index % 2 ? "reveal--right" : "reveal--left");
          else if (item.matches(".principle, .skill-card, .project, .career-step, .contact-panel, .hobby, .cert")) item.classList.add("reveal--scale");
          else if (item.matches(".education-entry")) item.classList.add("reveal--left");
          else if (item.matches(".pillar")) item.classList.add("reveal--right");
          else if (item.matches(".timeline")) item.classList.add("reveal--right");
          item.style.setProperty("--delay", `${(index % 4) * 75}ms`);
        });
        const revealObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -35px 0px" });
        revealItems.forEach((item) => revealObserver.observe(item));

        const navLinks = [...document.querySelectorAll('.nav-links a[href^="#"], .mm-links a[href^="#"]')];
        const sections = [...new Set(navLinks.map((link) => document.querySelector(link.getAttribute("href"))).filter(Boolean))];
        const navObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            navLinks.forEach((link) => {
              if (link.getAttribute("href") === `#${entry.target.id}`) link.setAttribute("aria-current", "location");
              else link.removeAttribute("aria-current");
            });
          });
        }, { rootMargin: "-25% 0px -65% 0px" });
        sections.forEach((section) => navObserver.observe(section));
      }

      /* ─── Interactive layer ─────────────────────────────────── */
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));


      // Chip stagger index
      document.querySelectorAll(".chips").forEach((group) => {
        [...group.children].forEach((chip, i) => chip.style.setProperty("--ci", i));
      });

      // Headline: split into words
      const heading = document.querySelector(".hero h1");
      if (heading && !reduceMotion) {
        let i = 0;
        const splitText = (node) => {
          const frag = document.createDocumentFragment();
          node.textContent.split(/(\s+)/).forEach((part) => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
            const w = document.createElement("span");
            w.className = "word";
            w.style.setProperty("--i", i++);
            w.textContent = part;
            frag.appendChild(w);
          });
          return frag;
        };
        [...heading.childNodes].forEach((node) => {
          if (node.nodeType === 3 && node.textContent.trim()) node.replaceWith(splitText(node));
          else if (node.nodeType === 1 && node.tagName === "SPAN") node.replaceChildren(splitText(node));
        });
        heading.setAttribute("aria-label", "Building thoughtful digital experiences.");
        heading.classList.add("is-split");
      }

      // Count-up for years
      const counter = document.querySelector("[data-count]");
      if (counter && !reduceMotion) {
        const target = Number(counter.dataset.count), suffix = counter.dataset.suffix || "";
        counter.textContent = `0${suffix}`;
        (window.portfolioReady || Promise.resolve()).then(() => setTimeout(() => {
          const start = performance.now(), duration = 1400;
          const tick = (now) => {
            const t = clamp((now - start) / duration, 0, 1);
            const eased = 1 - Math.pow(1 - t, 4);
            counter.textContent = `${Math.round(eased * target)}${suffix}`;
            if (t < 1) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        }, 350));
      }

      // Hero: interactive dot field
      const hero = document.querySelector(".hero");
      const canvas = document.querySelector(".hero-canvas");
      if (hero && canvas && canvas.getContext && !reduceMotion) {
        const ctx = canvas.getContext("2d");
        const gap = 30, radius = 150;
        let dots = [], w = 0, h = 0, dpr = 1, running = false, frame = 0;
        let colors = { base: "#aab8b1", hot: "#c3f36b" };
        const pointer = { x: -9999, y: -9999, active: false };
        const readColors = () => {
          const cs = getComputedStyle(document.documentElement);
          colors = { base: cs.getPropertyValue("--muted").trim() || colors.base, hot: cs.getPropertyValue("--lime").trim() || colors.hot };
        };
        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = hero.clientWidth; h = hero.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          dots = [];
          for (let y = gap / 2; y < h; y += gap) for (let x = gap / 2; x < w; x += gap) dots.push({ ox: x, oy: y, x, y, e: 0 });
        };
        // Batched draw: idle dots are bucketed by opacity and painted as tiny squares in a few fills;
        // only the handful of dots near the cursor get round arcs.
        const BUCKETS = 8;
        const draw = (time) => {
          ctx.clearRect(0, 0, w, h);
          const t = time * 0.001;
          const buckets = Array.from({ length: BUCKETS }, () => []);
          const hot = [];
          for (const d of dots) {
            let tx = d.ox, ty = d.oy, energy = 0;
            if (pointer.active) {
              const dx = d.ox - pointer.x, dy = d.oy - pointer.y;
              if (dx > -radius && dx < radius && dy > -radius && dy < radius) {
                const dist = Math.hypot(dx, dy);
                if (dist < radius) {
                  const f = 1 - dist / radius;
                  energy = f * f;
                  tx += (dx / (dist || 1)) * energy * 18;
                  ty += (dy / (dist || 1)) * energy * 18;
                }
              }
            }
            if (energy || d.e > 0.001 || d.x !== d.ox || d.y !== d.oy) {
              d.x += (tx - d.x) * 0.12; d.y += (ty - d.y) * 0.12; d.e += (energy - d.e) * 0.12;
              if (Math.abs(d.x - d.ox) < 0.05 && Math.abs(d.y - d.oy) < 0.05 && d.e < 0.001 && !energy) { d.x = d.ox; d.y = d.oy; d.e = 0; }
            }
            if (d.e > 0.04) { hot.push(d); continue; }
            const wave = 0.5 + 0.5 * Math.sin(t * 0.9 + d.ox * 0.012 + d.oy * 0.018);
            buckets[Math.min(BUCKETS - 1, (wave * BUCKETS) | 0)].push(d);
          }
          ctx.fillStyle = colors.base;
          for (let i = 0; i < BUCKETS; i++) {
            const list = buckets[i];
            if (!list.length) continue;
            ctx.globalAlpha = 0.07 + ((i + 0.5) / BUCKETS) * 0.08;
            for (const d of list) ctx.fillRect(d.x - 1, d.y - 1, 2, 2);
          }
          if (hot.length) {
            ctx.fillStyle = colors.hot;
            for (const d of hot) {
              ctx.globalAlpha = Math.min(1, 0.15 + d.e * 0.75);
              ctx.beginPath(); ctx.arc(d.x, d.y, 1 + d.e * 1.8, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          if (running) frame = requestAnimationFrame(draw);
        };
        const start = () => { if (!running) { running = true; frame = requestAnimationFrame(draw); } };
        const stop = () => { running = false; cancelAnimationFrame(frame); };
        readColors(); resize();
        canvas.classList.add("is-ready");
        window.addEventListener("resize", resize, { passive: true });
        window.addEventListener("themechange", () => { readColors(); if (heroVisible && !document.hidden) start(); });
        new MutationObserver(() => { if (document.documentElement.classList.contains("theme-switching")) stop(); })
          .observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
        hero.addEventListener("pointermove", (e) => { const r = hero.getBoundingClientRect(); pointer.x = e.clientX - r.left; pointer.y = e.clientY - r.top; pointer.active = true; });
        hero.addEventListener("pointerleave", () => { pointer.active = false; });
        let heroVisible = true;
        new IntersectionObserver(([entry]) => { heroVisible = entry.isIntersecting; (heroVisible && !document.hidden ? start() : stop()); }).observe(hero);
        document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
      }

      // Hero card: tilt, glare, and depth parallax
      const heroCard = document.querySelector(".hero-card");
      if (hero && heroCard && finePointer && !reduceMotion) {
        const layers = [...heroCard.querySelectorAll(".orbit-tag")].map((el, i) => ({ el, depth: [14, -18, 20, -12][i] || 10 }));
        const years = heroCard.querySelector(".hero-years");
        let raf = 0;
        hero.addEventListener("pointermove", (e) => {
          if (raf) return;
          raf = requestAnimationFrame(() => {
            raf = 0;
            const r = heroCard.getBoundingClientRect();
            const px = clamp((e.clientX - r.left) / r.width, -0.5, 1.5) - 0.5;
            const py = clamp((e.clientY - r.top) / r.height, -0.5, 1.5) - 0.5;
            const near = e.clientX > r.left - 140 && e.clientX < r.right + 140 && e.clientY > r.top - 140 && e.clientY < r.bottom + 140;
            if (!near) return reset();
            heroCard.classList.add("is-tilting");
            heroCard.style.transform = `perspective(900px) rotateX(${(-py * 9).toFixed(2)}deg) rotateY(${(px * 11).toFixed(2)}deg)`;
            heroCard.style.setProperty("--gx", `${(px + 0.5) * 100}%`);
            heroCard.style.setProperty("--gy", `${(py + 0.5) * 100}%`);
            layers.forEach(({ el, depth }) => { el.style.transform = `translate(${(px * depth).toFixed(1)}px, ${(py * depth).toFixed(1)}px)`; });
            if (years) years.style.transform = `translate(${(-px * 8).toFixed(1)}px, ${(-py * 8).toFixed(1)}px)`;
          });
        });
        const reset = () => {
          heroCard.classList.remove("is-tilting");
          heroCard.style.transform = "";
          layers.forEach(({ el }) => { el.style.transform = ""; });
          if (years) years.style.transform = "";
        };
        hero.addEventListener("pointerleave", reset);
      }

      // Pointer spotlight on cards
      if (finePointer) {
        document.querySelectorAll(".skill-card, .principle, .project, .contact-panel, .hobby").forEach((el) => {
          el.addEventListener("pointermove", (e) => {
            const r = el.getBoundingClientRect();
            el.style.setProperty("--mx", `${e.clientX - r.left}px`);
            el.style.setProperty("--my", `${e.clientY - r.top}px`);
          });
        });
      }

      // Magnetic buttons
      if (finePointer && !reduceMotion) {
        document.querySelectorAll(".button, .nav-cta").forEach((btn) => {
          btn.addEventListener("pointermove", (e) => {
            const r = btn.getBoundingClientRect();
            const x = (e.clientX - r.left - r.width / 2) * 0.22;
            const y = (e.clientY - r.top - r.height / 2) * 0.32;
            btn.style.transform = `translate(${x.toFixed(1)}px, ${(y - 2).toFixed(1)}px)`;
          });
          btn.addEventListener("pointerleave", () => { btn.style.transform = ""; });
        });
      }

      // Section kickers: scramble-in text
      if ("IntersectionObserver" in window && !reduceMotion) {
        const glyphs = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/";
        const scramble = (el) => {
          const final = el.textContent;
          const start = performance.now(), duration = 650;
          const step = (now) => {
            const t = clamp((now - start) / duration, 0, 1);
            const revealed = Math.floor(t * final.length);
            el.textContent = final.split("").map((ch, i) => (i < revealed || ch === " " ? ch : glyphs[(Math.random() * glyphs.length) | 0])).join("");
            if (t < 1) requestAnimationFrame(step); else el.textContent = final;
          };
          requestAnimationFrame(step);
        };
        const kickerObserver = new IntersectionObserver((entries, obs) => {
          entries.forEach((entry) => { if (entry.isIntersecting) { scramble(entry.target); obs.unobserve(entry.target); } });
        }, { threshold: 0.6 });
        document.querySelectorAll(".section-kicker").forEach((k) => kickerObserver.observe(k));
      }

      // Scroll-linked: career line, back-to-top ring
      const track = document.querySelector(".career-track");
      const steps = [...document.querySelectorAll(".career-step")];
      const toTop = document.querySelector(".to-top");
      const ring = toTop && toTop.querySelector(".ring-fill");
      const ringLength = 2 * Math.PI * 22;
      if (track && !reduceMotion) track.classList.add("js-progress");
      let scrollFrame = 0;
      const onScroll = () => {
        if (scrollFrame) return;
        scrollFrame = requestAnimationFrame(() => {
          scrollFrame = 0;
          const vh = window.innerHeight, anchor = vh * 0.62;
          if (track && !reduceMotion) {
            const r = track.getBoundingClientRect();
            track.style.setProperty("--career-progress", clamp((anchor - r.top) / r.height, 0, 1).toFixed(4));
            steps.forEach((step) => {
              const node = step.querySelector(".career-node");
              if (node) step.classList.toggle("is-passed", node.getBoundingClientRect().top < anchor);
            });
          }
          if (toTop) {
            const range = document.documentElement.scrollHeight - vh;
            const amount = range > 0 ? clamp(window.scrollY / range, 0, 1) : 0;
            toTop.classList.toggle("is-visible", window.scrollY > vh * 0.7);
            if (ring) ring.style.strokeDashoffset = (ringLength * (1 - amount)).toFixed(2);
          }
        });
      };
      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", onScroll, { passive: true });
      onScroll();
      if (toTop) toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

      // Copy email + toast
      const toast = document.querySelector(".toast");
      let toastTimer = 0;
      const showToast = (msg) => {
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
      };
      document.querySelectorAll(".copy-email").forEach((btn) => btn.addEventListener("click", async () => {
        const email = btn.dataset.email;
        let ok = false;
        try { await navigator.clipboard.writeText(email); ok = true; } catch (error) {
          try {
            const ta = document.createElement("textarea");
            ta.value = email; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove();
          } catch (e) {}
        }
        const label = btn.querySelector(".copy-label");
        if (ok) {
          btn.classList.add("is-copied");
          if (label) label.textContent = "Copied!";

            const line = window.innerHeight * 0.45;
            let key = "top";
            for (const m of sectionMap) if (m.el.getBoundingClientRect().top <= line) key = m.key;
            // at the very bottom the last section can't reach the line, so treat it as active
            if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) key = sectionMap[sectionMap.length - 1].key;
            setActive(key, true);
            dock.classList.add("is-visible");
          });
        };
        window.addEventListener("scroll", onDockScroll, { passive: true });
        window.addEventListener("resize", () => { placeIndicator(); onDockScroll(); }, { passive: true });
        setActive("top");
        (window.portfolioReady || Promise.resolve()).then(() => setTimeout(onDockScroll, 250));
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeIndicator);

        dock.addEventListener("click", (e) => {
          const it = e.target.closest(".dock-item"); if (!it) return;
          e.preventDefault();
          const key = it.dataset.key;
          const behavior = reduceMotion ? "auto" : "smooth";
          setActive(key);
          lockKey = key;
          clearTimeout(lockTimer);
          lockTimer = setTimeout(() => { lockKey = null; }, 1500);   // safety release if no scroll happens
          if (key === "top") window.scrollTo({ top: 0, behavior });
          else document.getElementById(key)?.scrollIntoView({ behavior });
        });

        // macOS-style magnification on desktop
        if (finePointer && !reduceMotion) {
          let mf = 0, mx = 0;
          const magnify = () => {
            mf = 0;
            items.forEach((it) => {
              const r = it.getBoundingClientRect();
              const d = Math.abs(mx - (r.left + r.width / 2));
              const f = Math.max(0, 1 - d / 130);
              const s = 1 + 0.32 * f * f;
              scaleOf.set(it, s);
              it.style.setProperty("--sc", s.toFixed(3));
              it.style.setProperty("--ty", `${(-8 * f * f).toFixed(1)}px`);
            });
            placeIndicator();
          };
          dock.addEventListener("pointermove", (e) => { mx = e.clientX; dock.classList.add("is-magnifying"); if (!mf) mf = requestAnimationFrame(magnify); });
          dock.addEventListener("pointerleave", () => {
            dock.classList.remove("is-magnifying");
            scaleOf = new Map();
            items.forEach((it) => { it.style.removeProperty("--sc"); it.style.removeProperty("--ty"); });
            placeIndicator();
          });
        }
      }
      /* ─── Project details panel ─────────────────────────────── */
      const pd = document.querySelector(".pd");
      if (pd && window.PORTFOLIO && window.PORTFOLIO.renderProjectDetails) {
        const root = document.documentElement;
        const body = pd.querySelector(".pd-body"), count = pd.querySelector(".pd-count");
        let current = -1, opener = null, closeTimer = 0;
        // prev/next follows the projects currently visible under the active filter
        const order = () => cards.filter((c) => !c.hidden).map((c) => Number(c.querySelector(".project-more")?.dataset.project)).filter((n) => !Number.isNaN(n));
        const render = (i, dir = 0) => {
          const list = order(); const pos = Math.max(0, list.indexOf(i));
          const apply = () => {
            body.innerHTML = window.PORTFOLIO.renderProjectDetails(i);
            body.scrollTop = 0;
            count.innerHTML = `<b>${pos + 1}</b> / ${list.length}`;
            current = i;
          };
          if (!dir || reduceMotion) return apply();
          body.style.setProperty("--dir", -dir);
          body.classList.add("is-swapping");
          setTimeout(() => { apply(); body.style.setProperty("--dir", dir); requestAnimationFrame(() => body.classList.remove("is-swapping")); }, 180);
        };
        const open = (i, from) => {
          clearTimeout(closeTimer);
          opener = from || document.activeElement;
          render(i);
          pd.hidden = false;
          root.classList.add("pd-open");
          requestAnimationFrame(() => requestAnimationFrame(() => pd.classList.add("is-open")));
          setTimeout(() => pd.querySelector(".pd-close").focus({ preventScroll: true }), 60);
        };
        const close = () => {
          pd.classList.remove("is-open");
          root.classList.remove("pd-open");
          closeTimer = setTimeout(() => { pd.hidden = true; body.innerHTML = ""; }, reduceMotion ? 0 : 520);
          opener?.focus({ preventScroll: true });
        };
        const step = (d) => { const list = order(); if (list.length < 2) return; const pos = list.indexOf(current); render(list[(pos + d + list.length) % list.length], d); };
        document.addEventListener("click", (e) => {
          const btn = e.target.closest(".project-more");
          if (btn) { open(Number(btn.dataset.project), btn); return; }
          if (pd.hidden) return;
          if (e.target.closest("[data-close]")) close();
          const s = e.target.closest("[data-step]"); if (s) step(Number(s.dataset.step));
        });
        document.addEventListener("keydown", (e) => {
          if (pd.hidden || !pd.classList.contains("is-open")) return;
          if (e.key === "Escape") { e.preventDefault(); close(); }
          else if (e.key === "ArrowRight") step(1);
          else if (e.key === "ArrowLeft") step(-1);
          else if (e.key === "Tab") {
            const f = [...pd.querySelectorAll("button, a[href]")].filter((el) => el.offsetParent);
            const i = f.indexOf(document.activeElement);
            if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
            else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
          }
        });
        // phones: swipe the sheet down to close
        const sheet = pd.querySelector(".pd-sheet"); let sy = null;
        sheet.addEventListener("touchstart", (e) => { if (body.scrollTop <= 0) sy = e.touches[0].clientY; }, { passive: true });
        sheet.addEventListener("touchmove", (e) => { if (sy === null) return; const dy = e.touches[0].clientY - sy; if (dy > 0) { sheet.style.transition = "none"; sheet.style.transform = `translateY(${dy}px)`; } }, { passive: true });
        sheet.addEventListener("touchend", (e) => {
          if (sy === null) return; const dy = e.changedTouches[0].clientY - sy; sy = null;
          sheet.style.transition = ""; sheet.style.transform = "";
          if (dy > 110) close();
        });
      }
      /* ─── Experience: responsibilities toggle ───────────────── */
      document.querySelectorAll(".career-more").forEach((btn) => btn.addEventListener("click", () => {
        const open = btn.getAttribute("aria-expanded") !== "true";
        btn.setAttribute("aria-expanded", String(open));
        btn.querySelector(".cm-label").textContent = open ? "Hide responsibilities" : "Show responsibilities";
        document.getElementById(btn.getAttribute("aria-controls"))?.classList.toggle("is-open", open);
      }));
    })();
  </script>
</body>
</html>
